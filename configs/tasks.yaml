# v4.1 task registry. `adapter` = src/tasks/* (unified); `legacy` = existing scripts.
# No task may enter EA before: adapter present + group splits audited + native baseline measured.
# v3 multi-domain evidence (Gate 1 verdicts, revisions, manifests) preserved verbatim below.
# Key renames vs pre-v4.1 file (content unchanged): processbench_math_choice -> processbench,
# findver_claim -> findver.
tasks:
  banking77_intent:
    domain: general
    form: multiclass
    labels: 77
    repo: mteb/banking77
    revision: 18072d2685ea682290f7b8924d94c62acc19c0b2
    role: sanity_and_menu_track
    adapter: src/tasks/intent.py
    adapter_status: implemented
    legacy: [scripts/prepare_v4_intent.py, scripts/run_intent_baseline.py, scripts/run_evo_menu_pilot.py]
