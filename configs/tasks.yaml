  processbench:
    domain: math
    form: step_localization
    source_repo: Qwen/ProcessBench
    data_revision: 3bdcd5371ed567559a78f559c01c13a6deee7604
    source_git_commit: e8024636bcabdf8bd514440551b531d3f90dd18b
    license: Apache-2.0
    task_type: choice
    label_mapping: label == -1 means all steps correct, else 0-based earliest-error step index (official run_eval.py match rule)
    candidates: one per step (0-based) plus ALL_STEPS_CORRECT sentinel last
    split_rule: group by problem text; stratified by (source file, error-vs-all-correct); seed 17; fractions train/dev/test 0.6/0.2/0.2
    split_manifest: results/processbench/split_manifest.json
    laya_actions: [single, wide, tournament]
    vela_paired_baseline: recorded 2026-10-30 (Laya 0.125 vs Vela 0.058 on 120 train rows; both near chance; Vela faster)
    stage4_sensitivity: FAILED 2026-10-31 (train n=100 + dev n=60; only significant effect was wide_max1024 harm on train, not replicated; nothing improves quality repeatably; Stage 5 ES blocked)
    action_adapter: single-first cascade (same cost definition as BANKING77)
    budgets: [1.00x, 1.25x, 1.50x, 2.00x]
    role: primary
    adapter: src/tasks/math.py
    adapter_status: implemented
    legacy: [scripts/prepare_processbench.py, scripts/build_processbench_cache.py, scripts/make_processbench_split.py]
    group_unit: problem_text
    status: gate1_failed_neat_paused
    gate: Gate 1 FAILED 2026-10-30 — tournament correct set identical to single; wide net-harmful; oracle +0.017; LR == majority. NEAT paused for math Choice.
  codexglue_defect:
